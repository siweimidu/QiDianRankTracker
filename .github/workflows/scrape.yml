name: Daily QiDian Rank Scraper

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

on:
  schedule:
    # 每天 UTC 20:17（北京时间次日 04:17）触发，避开整点高峰
    - cron: '17 20 * * *'
  workflow_dispatch: # 允许手动 Run workflow

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache Playwright Browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium-${{ hashFiles('requirements.txt') }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Warm WAF session & Scrape all boards (Top 30 per category)
      run: python scrape_qidian.py --top 30
      env:
        TZ: Asia/Shanghai
        SCRAPE_DEADLINE_SEC: "1500"

    - name: Build Latest Data with AI Analysis
      run: python scripts/build_latest.py
      env:
        TZ: Asia/Shanghai
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        API_MODEL: ${{ secrets.API_MODEL }}

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "[Auto] Update QiDian daily ranks"
        file_pattern: data api
        branch: main

    # ---- 内联部署 Pages（GITHUB_TOKEN 的 push 不会触发下游 pages.yml，故内联部署） ----
    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
